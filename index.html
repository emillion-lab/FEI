<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FEI (Fédération Équestre Internationale) Jumping Rules 2026 — BG / EN</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Sans+3:wght@300;400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1a;--bg2:#111827;--bg3:#1a2332;--card:#1e2a3a;--card-hover:#243346;--gold:#d4a853;--gold-dim:#b8923f;--green:#34d399;--red:#f87171;--blue:#60a5fa;--purple:#a78bfa;--text:#e8edf5;--text-dim:#8899aa;--text-muted:#556677;--border:#2a3a4a;--accent-glow:rgba(212,168,83,0.15);--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}
::selection{background:var(--gold);color:var(--bg)}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--text-muted);border-radius:4px}
.header{background:linear-gradient(135deg,var(--bg2) 0%,#1a1f35 50%,var(--bg2) 100%);border-bottom:1px solid var(--border);padding:8px 12px;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.header-top{max-width:1400px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-family:'Playfair Display',serif;font-size:1rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#f0d78c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:1px;white-space:nowrap}
.logo small{font-size:.5em;font-weight:400;letter-spacing:2px;display:block;opacity:.7}
.header-right{display:flex;align-items:center;gap:6px}
.search-wrap{position:relative;width:140px}
.search-wrap input{width:100%;padding:5px 8px 5px 26px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.8rem;outline:none;font-family:'Source Sans 3',sans-serif}
.search-wrap input:focus{border-color:var(--gold-dim);width:180px;transition:width .3s}
.search-wrap::before{content:'⌕';position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:.85rem}
.lang-toggle{display:flex;border-radius:6px;overflow:hidden;border:1px solid var(--border);font-size:.75rem;font-weight:700}
.lang-btn{padding:4px 10px;cursor:pointer;background:var(--bg3);color:var(--text-dim);border:none;font-family:'Source Sans 3',sans-serif;font-weight:700;transition:all .2s}
.lang-btn.active{background:var(--gold);color:var(--bg)}.lang-btn:hover:not(.active){background:var(--card-hover)}
.menu-toggle{display:none;background:none;border:1px solid var(--border);color:var(--text-dim);font-size:1.2rem;padding:4px 8px;border-radius:6px;cursor:pointer;font-family:'Source Sans 3',sans-serif}
.nav-strip{max-width:1400px;margin:6px auto 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav-strip::-webkit-scrollbar{display:none}
.nav-tabs{display:flex;gap:2px;flex-wrap:nowrap;width:max-content}
.nav-tab{padding:5px 10px;border-radius:6px;background:transparent;border:1px solid transparent;color:var(--text-dim);cursor:pointer;font-size:.78rem;font-weight:600;white-space:nowrap;transition:all .2s;font-family:'Source Sans 3',sans-serif}
.nav-tab:hover{color:var(--text);background:var(--bg3)}.nav-tab.active{background:var(--card);color:var(--gold);border-color:var(--border)}
.main{max-width:1200px;margin:0 auto;padding:16px 12px 40px}
.panel{display:none}.panel.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;background:linear-gradient(135deg,var(--gold),#f0d78c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px}
.section-subtitle{color:var(--text-dim);font-size:.9rem;margin-bottom:20px}
.stats-row{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.stat-card{flex:1;min-width:100px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-num{font-family:'Playfair Display',serif;font-size:1.5rem;font-weight:900;color:var(--gold)}.stat-label{font-size:.75rem;color:var(--text-dim);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.card h3{font-size:1rem;color:var(--blue);margin-bottom:10px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:14px}
.grid-3{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.mnemonic{margin-top:10px;padding:10px 14px;background:var(--accent-glow);border-left:3px solid var(--gold);border-radius:0 8px 8px 0}
.mnemonic-label{font-size:.75rem;font-weight:700;color:var(--gold);margin-bottom:4px}.mnemonic-text{font-size:.88rem;color:var(--text-dim)}
.penalty-table{width:100%;border-collapse:collapse;font-size:.85rem}
.penalty-table th{background:var(--bg3);color:var(--gold);padding:8px;text-align:left}.penalty-table td{padding:8px;border-bottom:1px solid var(--border)}
.pen-4{color:var(--gold);font-weight:700}.pen-6s{color:var(--purple);font-weight:700}.pen-elim{color:var(--red);font-weight:700}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:700;margin:2px}.tag-elim{background:rgba(248,113,113,.15);color:var(--red)}
.chapter-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;margin-bottom:4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:all .2s}
.chapter-header:hover{background:var(--card-hover)}.chapter-header h2{font-size:.95rem}
.chapter-tag{display:inline-block;background:var(--bg3);color:var(--gold);padding:2px 8px;border-radius:4px;font-size:.75rem;margin-right:8px}
.badge{font-size:.7rem;background:var(--bg3);color:var(--text-dim);padding:2px 8px;border-radius:4px}
.arrow{transition:transform .3s;color:var(--text-muted)}.chapter-header.open .arrow{transform:rotate(180deg)}
.chapter-body{display:none;padding:6px 0 14px}.chapter-body.open{display:block}
.article{background:var(--bg3);border-left:3px solid var(--border);border-radius:0 8px 8px 0;padding:14px 18px;margin:6px 0}
.article:hover{background:var(--card-hover);border-left-color:var(--gold)}
.article h4{font-size:.95rem;color:var(--blue);margin-bottom:6px}.article .detail{font-size:.88rem;color:var(--text-dim);line-height:1.6}
.article .key-point{display:inline-block;background:rgba(96,165,250,.1);color:var(--blue);padding:2px 8px;border-radius:4px;font-size:.75rem;margin:2px}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.q-number{font-size:.7rem;color:var(--text-muted);margin-bottom:6px}.q-text{font-size:.95rem;font-weight:700;margin-bottom:14px}
.quiz-option{display:block;width:100%;text-align:left;padding:10px 14px;margin:4px 0;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);cursor:pointer;font-size:.88rem;transition:all .2s;font-family:'Source Sans 3',sans-serif}
.quiz-option:hover:not(.disabled){border-color:var(--gold);background:var(--card-hover)}
.quiz-option.correct{background:rgba(52,211,153,.15);border-color:var(--green);color:var(--green)}
.quiz-option.wrong{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red)}
.quiz-option.disabled{pointer-events:none}
.quiz-explanation{display:none;margin-top:12px;padding:12px;background:var(--bg3);border-radius:8px;font-size:.85rem;color:var(--text-dim);border-left:3px solid var(--green)}
.progress-bar{width:100%;height:4px;background:var(--bg3);border-radius:2px;margin-bottom:12px}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.btn{padding:8px 18px;border-radius:8px;font-weight:700;cursor:pointer;font-family:'Source Sans 3',sans-serif;border:none;font-size:.85rem}
.btn-gold{background:var(--gold);color:var(--bg)}.btn-gold:hover{background:var(--gold-dim)}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text-dim)}.btn-sm{padding:5px 12px;font-size:.8rem}
.flashcard-container{perspective:1000px;max-width:500px;margin:0 auto}
.flashcard{width:100%;min-height:200px;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.flashcard.flipped{transform:rotateY(180deg)}
.flashcard-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.flashcard-front{background:var(--card);border:1px solid var(--border)}.flashcard-back{background:var(--bg3);border:1px solid var(--green);transform:rotateY(180deg)}
.sr-controls{display:flex;justify-content:center;gap:8px;margin-top:16px}
.sr-btn{padding:8px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:.8rem;border:none;font-family:'Source Sans 3',sans-serif}
.sr-again{background:rgba(248,113,113,.2);color:var(--red)}.sr-hard{background:rgba(167,139,250,.2);color:var(--purple)}
.sr-good{background:rgba(52,211,153,.2);color:var(--green)}.sr-easy{background:rgba(96,165,250,.2);color:var(--blue)}
@media(max-width:768px){.menu-toggle{display:block}.nav-strip{display:none}.nav-strip.open{display:block}.section-title{font-size:1.3rem}.article{padding:12px 14px}.stats-row{gap:6px}.stat-card{min-width:70px;padding:10px 6px}.stat-num{font-size:1.2rem}.grid-2{grid-template-columns:1fr}.search-wrap{width:100px}}
</style>
</head>
<body>
<header class="header">
<div class="header-top">
<div class="logo">FEI (Fédération Équestre Internationale) JUMPING 2026<small>LEARNING TOOL</small></div>
<div class="header-right">
<div class="lang-toggle"><button class="lang-btn active" id="langEN" onclick="setLang('en')">EN</button><button class="lang-btn" id="langBG" onclick="setLang('bg')">BG</button></div>
<div class="search-wrap"><input type="text" id="searchInput" placeholder="Search..."></div>
<button class="menu-toggle" onclick="document.querySelector('.nav-strip').classList.toggle('open')">☰</button>
</div></div>
<nav class="nav-strip"><div class="nav-tabs" id="navTabs"></div></nav>
</header>
<div class="main">
<div class="panel active" id="panel-overview"><div id="overviewContent"></div></div>
<div class="panel" id="panel-chapters"><div id="chaptersContent"></div></div>
<div class="panel" id="panel-penalties"><div id="penaltiesContent"></div></div>
<div class="panel" id="panel-quiz"><div id="quizPanel"></div></div>
<div class="panel" id="panel-flashcards"><div id="flashcardsPanel"></div></div>
<div class="panel" id="panel-cheatsheet"><div id="cheatsheetContent"></div></div>
<div class="panel" id="panel-scenarios"><div id="scenariosContent"></div></div>
</div>
<script>
let currentLang = 'en';
function t(en, bg) { return currentLang === 'en' ? en : bg; }

const navItems = [
  { id: 'overview', en: '📋 Overview', bg: '📋 Преглед' },
  { id: 'chapters', en: '📖 Chapters', bg: '📖 Глави' },
  { id: 'penalties', en: '⚖️ Penalties', bg: '⚖️ Наказания' },
  { id: 'quiz', en: '🧠 Quiz', bg: '🧠 Тест' },
  { id: 'flashcards', en: '🃏 Flashcards', bg: '🃏 Карти' },
  { id: 'cheatsheet', en: '📌 Cheatsheet', bg: '📌 Справочник' },
  { id: 'scenarios', en: '🎯 Scenarios', bg: '🎯 Сценарии' }
];

function setLang(lang) {
  currentLang = lang;
  document.getElementById('langBG').classList.toggle('active', lang === 'bg');
  document.getElementById('langEN').classList.toggle('active', lang === 'en');
  document.documentElement.lang = lang;
  document.getElementById('searchInput').placeholder = t('Search...', 'Търси...');
  renderAll();
}

function renderNav() {
  document.getElementById('navTabs').innerHTML = navItems.map((n, i) =>
    `<button class="nav-tab${i===0?' active':''}" data-panel="${n.id}" onclick="switchPanel('${n.id}',this)">${n[currentLang]}</button>`
  ).join('');
}

function switchPanel(id, btn) {
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelector(`[data-panel="${id}"]`)?.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');
}

// ===== CHAPTERS DATA =====
const CH = {
en: [
{num:"I",title:"Introduction (Art. 200-201)",articles:[
{art:"200",title:"General Provisions",detail:"Jumping = test of freedom, power, skill and speed of the horse. Winner: fewest penalties + fastest time/most points. Five event levels: CSI/CSIO from 1★ to 5★.",keys:["CSI vs CSIO","1★-5★","Variety"]},
{art:"201",title:"Effective Date",detail:"In force from 1 January 2026. TRANSITIONAL: Tack/equipment rules will be in a separate document from 1 Jan 2027. Annex VIII remains in force until then.",keys:["1 Jan 2026","Tack → 2027"]}
]},
{num:"II",title:"Athletes & Horses (Art. 202-207)",articles:[
{art:"202",title:"Age of Horses",detail:"Northern hemisphere: birthday 1 Jan. Southern: 1 Aug. Southern in Northern → -1 year category. Min ages: Olympics=9, Continental=8, CSI3-5★=7, CSI1-2★=6.",keys:["9/8/7/6 rule","Hemispheres"]},
{art:"203",title:"Number of Horses",detail:"Max 4 horses per athlete. Grand Prix: 1 horse (2 if ≤50% starters for CSI1-3★). Puissance/Derby/Six Bar: +1 extra. Tours: 4 per category, 9 for CSIYH.",keys:["Max 4","GP=1 horse"]},
{art:"205",title:"Athlete Age Requirements",detail:"Under 18: banned from GP at CSI3-5★, Nations Cup, World Cup, Puissance, Derby. From 12: up to 1.30m. From 14: up to 1.40m at CSI2-5★. From 16: all competitions.",keys:["12/14/16/18 rule"]},
{art:"206-207",title:"Tack, Equipment & Dress",detail:"Headgear: ALWAYS when riding. Unfastened chinstrap + jump = ELIM. Electronics: in Warm-up = Warning, in Competition = ELIM. Dress: white breeches, white collar, jacket.",keys:["Headgear = mandatory","Phone = forbidden"]}
]},
{num:"III",title:"Officials (Art. 208-215)",articles:[
{art:"209",title:"Ground Jury",detail:"Min 3 judges in booth. Level 1-4 (4=highest). Olympics/Worlds: President L4 + 4 members. CSI5★: President + FJ + 2 members. CSI1★: President + 3 members (national judges allowed).",keys:["Min 3 in booth","L1-L4 system"]},
{art:"211",title:"Course Designer",detail:"Olympics: min L4 (FEI appoints). CSI3-5★: min L3. CSI1-2★: min L2. CSI Cat.B: min L1.",keys:["L4/L3/L2/L1"]},
{art:"215",title:"Video Assistance",detail:"Official video must be submitted within 30 min after results. Only at discretion of Jury President. Requires incontrovertible evidence. NEVER can video determine time.",keys:["30 min deadline","Incontrovertible"]}
]},
{num:"IV",title:"Scoring & Formats (Art. 216-231)",articles:[
{art:"217",title:"Table A and Table C",detail:"TABLE A: faults in points (4 for knock-down, 1/sec for exceeding time). TABLE C: faults in seconds (4 sec outdoor, 3 sec indoor). Table C: 1st refusal = 0 penalty, but refusal + knock-down = 6 sec.",keys:["Table A = points","Table C = seconds"]},
{art:"218",title:"Jump-Off",detail:"Max 1 jump-off per competition. Min 6 obstacles. Min 1 combination (if in course). Max 2 additional obstacles. Combination distances NEVER change. Same horse.",keys:["Min 6 obstacles","Never ≠ distance"]},
{art:"219",title:"Grand Prix",detail:"Formats: 1 round + JO / 2 rounds + JO / 2 rounds (2nd against clock). For CSIO: 1 round AC + JO / 2 rounds without JO / 2 rounds + JO. Term Grand Prix = only once per category.",keys:["GP = 1x per category"]},
{art:"222",title:"Two-Phase Competition",detail:"NORMAL: phase 1 (7-9 obs.) → only clear continue → phase 2 (4-6 obs.). SPECIAL: all continue, phase 1 (5-7) + phase 2, total 11-13 obstacles.",keys:["Normal vs Special"]},
{art:"226",title:"Nations Cup",detail:"Team of 4 (min 3). 2 rounds, same course, same day. Table A, both rounds Against Clock. Scoring: best 3 count. Min 3 nations. 6-10 teams for 2nd round. Jump-off: 1 rider per team.",keys:["4 riders","Best 3 count","2 rounds"]},
{art:"230",title:"Power & Skill",detail:"PUISSANCE: 4-6 obstacles, wall up to 1.80m, successive jump-offs (max 4). SIX BAR: 6 verticals at ~11m distance, raised in JO. Time NEVER decides.",keys:["Puissance","Six Bar","No time"]}
]},
{num:"V",title:"Obstacles (Art. 232-240)",articles:[
{art:"232-234",title:"General & Verticals",detail:"Top 1/4 of obstacle = knockable elements. Cups: depth 18-20mm. Vertical = height only, no width. Max 1.70m (outdoor), 1.65m (indoor).",keys:["18-20mm cups","1.70/1.65 max"]},
{art:"235-236",title:"Spreads & Water Jump",detail:"Spread: mandatory safety cups (18mm for rear top pole). Water jump: min 2.00m, max 4.00m incl. takeoff (40-50cm). Plasticine strip. Fault = hoof touching strip OR touching water.",keys:["Safety cups","Plasticine","Liverpool ≤2m"]},
{art:"237-238",title:"Combinations",detail:"Distance: 7-12m. Triple bar: only as 1st element. On refusal → all elements again (except closed). CLOSED comb.: jump out in direction of course.",keys:["7-12m","Closed vs Open"]}
]},
{num:"VI",title:"Arenas (Art. 241-243)",articles:[
{art:"241",title:"Competition Arena",detail:"Indoor: min 1200m² (25m width). Outdoor: min 4000m² (50m). Course length ≤ obstacles×60m. Start/finish: 6-15m from obstacle. Flags: Red RIGHT, White LEFT.",keys:["1200/4000m²","Red=Right"]},
{art:"242",title:"Warm-Up Arena",detail:"Min 1 vertical + 1 spread. Height ≤1.40m → max +10cm above competition max. >1.40m → max 1.65m height, 1.80m width. Combinations FORBIDDEN (except Six Bar).",keys:["No combinations","+10 cm rule"]},
{art:"243",title:"Training Arena",detail:"Placing poles: not closer than 2.50m. Bounce: max 3 verticals ≤1.00m, distance 2.50-3.00m. Gymnastics: height ≤1.30m.",keys:["Placing poles 2.50m","Bounce ≤1.00m"]}
]},
{num:"VII",title:"Penalties During Round (Art. 244-250)",articles:[
{art:"245",title:"Obstacle knocked down",detail:"When top part falls or one end not on support. 2+ parts of vertical → only top penalized. Spread with multiple planes → 1 fault. Last obstacle: penalized even if falls AFTER finish.",keys:["1 fault for spread","Last obstacle"]},
{art:"246",title:"Disobedience",detail:"REFUSAL: stopping in front. RUN-OUT: evading sideways. RESISTANCE: refusing to continue. CIRCLING: around obstacle. Clock does NOT stop for refusal/run-out.",keys:["Refusal/Run-out/Resistance/Circle"]},
{art:"248",title:"Fall",detail:"Athlete: separation from horse + touching ground. Horse: shoulder + hindquarters touch ground. Before start: 'did not start'. During round: ELIM. After finish: NOT elim (but no immediate JO).",keys:["Before=DNS","During=ELIM","After=no ELIM"]}
]},
{num:"VIII",title:"Time & Speed (Art. 251-258)",articles:[
{art:"251-253",title:"Time & Limits",detail:"Start: crossing start OR expiry of 45-sec countdown. End: crossing finish. Time allowed = distance/speed. Max limit = 2× time allowed.",keys:["45 sec countdown","Max = 2× allowed"]},
{art:"256",title:"6-Second Correction",detail:"Disobedience + knock-down → bell → stop → rebuild → bell → +6 sec. Clock starts when horse leaves ground at obstacle.",keys:["Disobedience + knock-down = 6 sec"]}
]},
{num:"IX",title:"Fines, Warnings, Eliminations (Art. 259-266)",articles:[
{art:"259-260",title:"JRW & Yellow Cards",detail:"Jumping Recorded Warning: blood from tack/athlete. 2× JRW in 12 months → CHF 1000 + 1 month suspension.",keys:["JRW","2×JRW = suspension"]},
{art:"263",title:"Elimination",detail:"25+ reasons for elimination. Key: fall, 2nd disobedience, >45 sec, wrong course, unauthorized assistance, jumping without bell. After elim: 1 jump allowed (except after fall).",keys:["25+ reasons","1 jump after elim"]},
{art:"265-266",title:"Abuse & Boot Control",detail:"Horse abuse → disqualification + fines + suspension. Boot & Bandage control: max 500g per leg. Hind leg boots: specific rules for size and fastenings.",keys:["Max 500g per leg"]}
]},
{num:"X-XI",title:"Placing & Organisation (Art. 267-279)",articles:[
{art:"267-268",title:"Placing & Prizes",detail:"Prize money distribution: top 13 placed mandatory. FEI badges of honour for sporting achievements.",keys:["Top 13 mandatory"]},
{art:"272-276",title:"Entries & Veterinary Control",detail:"Veterinary inspection + passport control mandatory. Doping control per VRs. Starting order: draw or reverse of ranking.",keys:["Vet. inspection","Start order = draw"]}
]},
{num:"XII-XIII",title:"Championships (Art. 280-301)",articles:[
{art:"280-289",title:"World & Continental Championships",detail:"3 competitions: 1st (team+ind.), 2nd (team final), 3rd (ind. final). Certificate of Capability mandatory. Olympics: min 9yr horse, L4 officials.",keys:["3 competitions","CoC mandatory"]},
{art:"290-301",title:"Youth/Veterans Championships",detail:"Young Riders: max 1.50m. Juniors: max 1.40m. Ponies: max 1.35m. Children: max 1.30m. Veterans: max 1.30m. Teams of 4-5, best 3 count.",keys:["YR=1.50","J=1.40","P=1.35","Ch=1.30"]}
]},
{num:"XIV",title:"Youth, Veterans, Amateurs (Art. 302-307)",articles:[
{art:"302-305",title:"Specific Rules",detail:"U25/YR/J: Cat A (with PM, like CSI2★) and Cat B (without PM, like CSI1★). Ponies: max 1.30m. Children: horses only (no ponies!), max 1.30m, Table C forbidden.",keys:["Cat A vs Cat B","Children = horses"]},
{art:"307",title:"Amateurs",detail:"Max 1.40m obstacles. Entry fee max €1500. Cannot earn from riding/lessons/advertising. If jumps ≥1.50m → loses amateur status for the year.",keys:["Max 1.40m","€1500 entry fee"]}
]}
],
bg: [
{num:"I",title:"Въведение (Чл. 200-201)",articles:[
{art:"200",title:"Общи разпоредби",detail:"Скокове = тест за свобода, сила, умение и скорост на коня. Победител: най-малко наказания + най-бързо време/най-много точки. Пет нива: CSI/CSIO от 1★ до 5★.",keys:["CSI vs CSIO","1★-5★","Разнообразие"]},
{art:"201",title:"Дата на влизане в сила",detail:"В сила от 1 януари 2026. ПРЕХОДНИ: Правилата за екипировка ще бъдат в отделен документ от 1 ян. 2027. Анекс VIII остава в сила до тогава.",keys:["1 ян 2026","Tack → 2027"]}
]},
{num:"II",title:"Ездачи и коне (Чл. 202-207)",articles:[
{art:"202",title:"Възраст на конете",detail:"Северно полукълбо: рожден ден 1 ян. Южно: 1 авг. Южно в Северно → -1 год категория. Мин. възрасти: Олимпийски=9, Конт.=8, CSI3-5★=7, CSI1-2★=6.",keys:["9/8/7/6 правило","Полукълба"]},
{art:"203",title:"Брой коне",detail:"Макс. 4 коня на ездач. Grand Prix: 1 кон (2 при ≤50% стартери за CSI1-3★). Puissance/Derby/Six Bar: +1. Tours: 4 на категория, 9 за CSIYH.",keys:["Макс 4","GP=1 кон"]},
{art:"205",title:"Възрастови изисквания",detail:"Преди 18г.: забрана за GP на CSI3-5★, Nations Cup, World Cup, Puissance, Derby. От 12г.: до 1.30м. От 14г.: до 1.40м в CSI2-5★. От 16г.: всички състезания.",keys:["12/14/16/18 правило"]},
{art:"206-207",title:"Екипировка и облекло",detail:"Каскет: ВИНАГИ при яздене. Незастегнат ремък + скок = ЕЛИМ. Електроника: в Warm-up = Warning, в Competition = ЕЛИМ. Облекло: бели бричове, бял яка, жакет.",keys:["Каскет = задължителен","Телефон = забранен"]}
]},
{num:"III",title:"Длъжностни лица (Чл. 208-215)",articles:[
{art:"209",title:"Съдийска колегия",detail:"Мин. 3 съдии в кабината. Ниво 1-4 (4=най-високо). Олимпийски/Световно: Президент L4 + 4 члена. CSI5★: Президент + FJ + 2 члена. CSI1★: Президент + 3 члена.",keys:["Мин. 3 в кабината","L1-L4 система"]},
{art:"211",title:"Маршрут-дизайнер",detail:"Олимпийски: мин. L4 (FEI назначава). CSI3-5★: мин. L3. CSI1-2★: мин. L2. CSI Cat.B: мин. L1.",keys:["L4/L3/L2/L1"]},
{art:"215",title:"Видео помощ",detail:"Видеозапис до 30 мин. след резултатите. Само на усмотрение на президента на журито. Неоспоримо доказателство. НИКОГА видео за определяне на време.",keys:["30 мин срок","Неоспоримо"]}
]},
{num:"IV",title:"Точкуване и формати (Чл. 216-231)",articles:[
{art:"217",title:"Table A и Table C",detail:"TABLE A: грешки в точки (4 за съборена, 1/сек за превишено време). TABLE C: грешки в секунди (4 сек outdoor, 3 сек indoor). Table C: 1-ви отказ = 0 наказание, но отказ + съборена = 6 сек.",keys:["Table A = точки","Table C = секунди"]},
{art:"218",title:"Jump-Off",detail:"Макс. 1 jump-off на състезание. Мин. 6 пречки. Мин. 1 комбинация. Макс. 2 допълнителни пречки. Разстоянията в комбинации НИКОГА не се променят. Същия кон.",keys:["Мин. 6 пречки","Никога ≠ разстояние"]},
{art:"219",title:"Grand Prix",detail:"Формати: 1 кръг + JO / 2 кръга + JO / 2 кръга (2-ри против часовник). За CSIO: 1 кръг АС + JO / 2 кръга без JO / 2 кръга + JO. Grand Prix = само веднъж на категория.",keys:["GP = 1x на категория"]},
{art:"222",title:"Двуфазно състезание",detail:"НОРМАЛНА: фаза 1 (7-9 пр.) → само чисти продължават → фаза 2 (4-6 пр.). СПЕЦИАЛНА: всички продължават, фаза 1 (5-7) + фаза 2, общо 11-13 пречки.",keys:["Нормална vs Специална"]},
{art:"226",title:"Nations Cup",detail:"Отбор от 4 (мин. 3). 2 кръга, същия маршрут, същия ден. Table A, двата кръга Against Clock. Класиране: 3-те най-добри. Мин. 3 нации. 6-10 отбора за 2-ри кръг. Jump-off: 1 ездач на отбор.",keys:["4 ездачи","3 най-добри","2 кръга"]},
{art:"230",title:"Сила и умение",detail:"PUISSANCE: 4-6 пречки, стена до 1.80м, последователни jump-off (макс. 4). SIX BAR: 6 вертикални на ~11м, повдигане при JO. Време НИКОГА не решава.",keys:["Puissance","Six Bar","Без време"]}
]},
{num:"V",title:"Препятствия (Чл. 232-240)",articles:[
{art:"232-234",title:"Общи и вертикални",detail:"Горната 1/4 от пречката = knockable елементи. Чашки: дълб. 18-20мм. Вертикална = само височина. Макс 1.70м (outdoor), 1.65м (indoor).",keys:["18-20мм чашки","1.70/1.65 макс"]},
{art:"235-236",title:"Spread и воден скок",detail:"Spread: задължителни safety cups (18мм за заден горен прът). Воден скок: мин. 2.00м, макс. 4.00м вкл. takeoff (40-50см). Пластилинова лента. Грешка = допир до лентата ИЛИ до водата.",keys:["Safety cups","Пластилин","Liverpool ≤2м"]},
{art:"237-238",title:"Комбинации",detail:"Разстояние: 7-12м. Triple bar: само 1-ви елемент. При отказ → всички елементи наново (освен closed). CLOSED комб.: скачане навън по посока.",keys:["7-12м","Closed vs Open"]}
]},
{num:"VI",title:"Арени (Чл. 241-243)",articles:[
{art:"241",title:"Състезателна арена",detail:"Indoor: мин. 1200м² (25м ширина). Outdoor: мин. 4000м² (50м). Маршрут ≤ пречки×60м. Старт/финиш: 6-15м от пречка. Флагове: Червен ДЯСНО, Бял ЛЯВО.",keys:["1200/4000м²","Червен=Дясно"]},
{art:"242",title:"Загрявка",detail:"Мин. 1 вертикална + 1 spread. Височина ≤1.40м → макс. +10 см. >1.40м → макс. 1.65м височина, 1.80м ширина. Комбинации ЗАБРАНЕНИ (освен Six Bar).",keys:["Без комбинации","+10 см правило"]},
{art:"243",title:"Тренировъчна арена",detail:"Placing poles: не по-близо от 2.50м. Bounce: макс. 3 вертикални ≤1.00м, разст. 2.50-3.00м. Гимнастика: височина ≤1.30м.",keys:["Placing poles 2.50м","Bounce ≤1.00м"]}
]},
{num:"VII",title:"Наказания по време на кръг (Чл. 244-250)",articles:[
{art:"245",title:"Съборена пречка",detail:"Когато горна част падне или единият край не лежи на опора. 2+ части на вертикална → само горната. Spread → 1 грешка. Последна пречка: наказва се и ако падне СЛЕД финиша.",keys:["1 грешка за spread","Последна пречка"]},
{art:"246",title:"Неподчинение",detail:"ОТКАЗ: спиране пред пречка. БЯГСТВО: избягване встрани. СЪПРОТИВА: отказ да продължи. КРЪГ: около пречка. Часовникът НЕ спира при отказ/бягство.",keys:["Отказ/Бягство/Съпротива/Кръг"]},
{art:"248",title:"Падане",detail:"Ездач: отделяне от коня + допир до земя. Кон: рамо + задница на земята. Преди старта: 'did not start'. По време на кръг: ЕЛИМ. След финиша: НЕ елим (но не може JO).",keys:["Преди=DNS","По време=ЕЛИМ","След=без ЕЛИМ"]}
]},
{num:"VIII",title:"Време и скорост (Чл. 251-258)",articles:[
{art:"251-253",title:"Време и лимити",detail:"Начало: пресичане на старт ИЛИ изтичане на 45-сек. Край: пресичане на финиш. Допустимо време = дължина/скорост. Макс. лимит = 2× допустимо.",keys:["45 сек обр. броене","Макс = 2× допустимо"]},
{art:"256",title:"Корекция 6 секунди",detail:"Неподчинение + съборена → камбана → стоп → възстановяване → камбана → +6 сек. Часовникът тръгва когато конят напусне земята при пречката.",keys:["Неподчинение + съборена = 6 сек"]}
]},
{num:"IX",title:"Глоби, предупреждения, елиминации (Чл. 259-266)",articles:[
{art:"259-260",title:"JRW и жълти картони",detail:"Jumping Recorded Warning: кръв от tack/ездач. 2× JRW в 12 месеца → CHF 1000 + 1 месец суспенсия.",keys:["JRW","2×JRW = суспенсия"]},
{art:"263",title:"Елиминация",detail:"25+ причини. Ключови: падане, 2-ро неподчинение, >45 сек, грешен маршрут, неразрешена помощ, скачане без камбана. След елим: 1 скок разрешен (освен при падане).",keys:["25+ причини","1 скок след елим"]},
{art:"265-266",title:"Злоупотреба и контрол",detail:"Злоупотреба с коне → дисквалификация + глоби + суспенсия. Boot контрол: макс 500г на крак.",keys:["Макс 500г на крак"]}
]},
{num:"X-XI",title:"Класиране и организация (Чл. 267-279)",articles:[
{art:"267-268",title:"Класиране и награди",detail:"Разпределение на награден фонд: топ 13 класирани задължително.",keys:["Топ 13 задължително"]},
{art:"272-276",title:"Записвания и вет. контрол",detail:"Ветеринарен преглед + паспортен контрол задължителни. Допинг контрол по VRs. Стартов ред: жребий или обратно на класирането.",keys:["Вет. преглед","Стартов ред = жребий"]}
]},
{num:"XII-XIII",title:"Първенства (Чл. 280-301)",articles:[
{art:"280-289",title:"Световни и континентални",detail:"3 състезания: 1-во (отборно+инд.), 2-ро (отборен финал), 3-то (инд. финал). Certificate of Capability задължителен. Олимпийски: мин. 9г. кон.",keys:["3 състезания","CoC задължителен"]},
{art:"290-301",title:"Първенства за младежи/ветерани",detail:"Young Riders: макс 1.50м. Juniors: макс 1.40м. Ponies: макс 1.35м. Children: макс 1.30м. Veterans: макс 1.30м. Отбори от 4-5, 3-те най-добри се броят.",keys:["YR=1.50","J=1.40","P=1.35","Ch=1.30"]}
]},
{num:"XIV",title:"Младежи, ветерани, аматьори (Чл. 302-307)",articles:[
{art:"302-305",title:"Специфични правила",detail:"U25/YR/J: Cat A (с PM, като CSI2★) и Cat B (без PM, като CSI1★). Ponies: макс 1.30м. Children: само коне (не понита!), макс 1.30м, Table C забранен.",keys:["Cat A vs Cat B","Children = коне"]},
{art:"307",title:"Аматьори",detail:"Макс. 1.40м пречки. Entry fee макс €1500. Не може да печели от яздене/уроци/реклама. Ако скочи ≥1.50м → губи аматьорски статус.",keys:["Макс 1.40м","€1500 entry fee"]}
]}
]
};

// ===== QUIZ =====
let quizCorrect=0, quizTotal=0;
function generateQuiz() {
  quizCorrect=0; quizTotal=0;
  const data = QZ[currentLang];
  const shuffled = [...data].sort(()=>Math.random()-.5).slice(0,10);
  const qp = document.getElementById('quizPanel');
  qp.innerHTML = `<h1 class="section-title">${t('🧠 Self-Check Quiz','🧠 Тест за самопроверка')}</h1>
    <p class="section-subtitle">${t('Test your knowledge. Click an answer to see the explanation.','Тествайте знанията си. Кликнете отговор за обяснение.')}</p>
    <div class="progress-bar"><div class="progress-fill" id="quizProgress" style="width:0%"></div></div>
    <div id="quizScore" style="text-align:center;margin-bottom:16px;color:var(--gold);font-weight:700;"></div>` +
    shuffled.map((q,i) => `<div class="quiz-card" id="qCard${i}">
      <div class="q-number">${t('Question','Въпрос')} ${i+1} / 10</div>
      <div class="q-text">${q.q}</div>
      ${q.opts.map((o,j) => `<button class="quiz-option" onclick="answerQuiz(${i},${j},${q.c})">${o}</button>`).join('')}
      <div class="quiz-explanation" id="qExpl${i}">${q.e}</div>
    </div>`).join('') +
    `<div style="text-align:center;margin-top:20px;"><button class="btn btn-gold" onclick="generateQuiz()">${t('🔄 New Quiz (10 questions)','🔄 Нов тест (10 въпроса)')}</button></div>`;
}
function answerQuiz(qi,sel,cor) {
  const card=document.getElementById('qCard'+qi);
  const btns=card.querySelectorAll('.quiz-option');
  if(btns[0].classList.contains('disabled'))return;
  quizTotal++;
  btns.forEach((b,j)=>{b.classList.add('disabled');if(j===cor)b.classList.add('correct');if(j===sel&&j!==cor)b.classList.add('wrong');});
  if(sel===cor)quizCorrect++;
  document.getElementById('qExpl'+qi).style.display='block';
  document.getElementById('quizProgress').style.width=(quizTotal*10)+'%';
  document.getElementById('quizScore').textContent=`Score: ${quizCorrect}/${quizTotal}`;
}

let fcIdx=0,fcDeck=[];
function initFlashcards() {
  fcDeck=[...FC[currentLang]].sort(()=>Math.random()-.5); fcIdx=0;
  const fp=document.getElementById('flashcardsPanel');
  fp.innerHTML=`<h1 class="section-title">${t('🃏 Flashcards','🃏 Флашкарти')}</h1>

    <div class="flashcard-container"><div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-face flashcard-front"><p style="font-size:.75rem;color:var(--text-muted);margin-bottom:8px;">${t('QUESTION','ВЪПРОС')}</p><h3 id="fcQuestion"></h3><p>${t('Click to reveal','Кликнете за отговор')}</p></div>

    </div></div>
    <div class="sr-controls">
      <button class="sr-btn sr-again" onclick="rateCard(0)">${t('❌ Again','❌ Пак')}</button>
      <button class="sr-btn sr-hard" onclick="rateCard(1)">${t('😐 Hard','😐 Трудно')}</button>
      <button class="sr-btn sr-good" onclick="rateCard(2)">${t('👍 Good','👍 Добре')}</button>
      <button class="sr-btn sr-easy" onclick="rateCard(3)">${t('⚡ Easy','⚡ Лесно')}</button>
    </div>
    <div style="text-align:center;margin-top:16px;"><button class="btn btn-outline btn-sm" onclick="initFlashcards()">${t('🔄 Reset','🔄 Отначало')}</button></div>`;
  showFC();
}
function showFC() {
  if(fcIdx>=fcDeck.length){fcIdx=0;fcDeck.sort(()=>Math.random()-.5);}
  const f=fcDeck[fcIdx];
  document.getElementById('fcQuestion').textContent=f.q;
  document.getElementById('fcAnswer').textContent=f.a;
  document.getElementById('flashcard').classList.remove('flipped');
  document.getElementById('fcCounter').textContent=`${t('Card','Карта')} ${fcIdx+1} / ${fcDeck.length}`;
  document.getElementById('fcProgress').style.width=((fcIdx/fcDeck.length)*100)+'%';
}
function flipCard(){document.getElementById('flashcard').classList.toggle('flipped');}
function rateCard(r){if(r===0)fcDeck.push(fcDeck[fcIdx]);fcIdx++;showFC();}

// ===== SEARCH =====
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.toLowerCase().trim();
  if (q.length < 2) return;
  switchPanel('chapters');
  document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
  document.querySelector('[data-panel="chapters"]')?.classList.add('active');
  document.querySelectorAll('.chapter-body').forEach(b => b.classList.add('open'));
  document.querySelectorAll('.chapter-header').forEach(h => h.classList.add('open'));
  document.querySelectorAll('.article').forEach(a => {
    const text = a.textContent.toLowerCase();
    a.style.display = text.includes(q) ? 'block' : 'none';
    if (text.includes(q)) a.style.borderLeftColor = 'var(--gold)';
  });
});
